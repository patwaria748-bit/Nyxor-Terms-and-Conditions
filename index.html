<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nyxor</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:radial-gradient(circle at 50% 30%,#2a1566 0%,#0b0b12 70%);
font-family:system-ui,sans-serif;color:#e9e4ff;padding:20px}
.card{max-width:480px;width:100%;text-align:center;padding:40px 28px;border-radius:20px;
background:rgba(20,14,45,.75);border:1px solid rgba(124,58,237,.5);
box-shadow:0 0 40px rgba(124,58,237,.25)}
h1{margin:0 0 8px;font-size:2.6rem;letter-spacing:2px;color:#fff;
text-shadow:0 0 18px #7c3aed}
p{margin:0 0 28px;color:#b8aee0;line-height:1.5}
a.btn{display:block;margin:12px 0;padding:14px;border-radius:12px;text-decoration:none;
font-weight:600;color:#0b0b12;background:#22d3ee;transition:.2s}
a.btn.alt{background:transparent;color:#22d3ee;border:1px solid #22d3ee}
a.btn:hover{transform:translateY(-2px);box-shadow:0 0 18px rgba(34,211,238,.5)}
small{display:block;margin-top:26px;color:#7d72a8}
</style></head>
<body>
<div class="card">
<h1>NYXOR</h1>
<p>A security bot that keeps your Discord server safe.</p>
<a class="btn" href="terms.html">Terms of Service</a>
<a class="btn alt" href="privacy.html">Privacy Policy</a>
<small>&copy; 2026 Nyxor. All rights reserved.</small>
</div>
</body></html>
